# Roundtable injury list — runs every hour.
# Downloads Sleeper's public player file (about 15 MB) once, keeps only the
# QB/RB/WR/TE players who carry an injury status, and publishes that as a
# small injuries.json (about 13 KB) for roundtabletrades.com to read.
# Labels only: Roundtable never changes a player's value because of it.
name: injuries
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: injuries
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build the injury list from Sleeper
        run: |
          node - <<'EOF'
          const fs = require("fs");
          (async () => {
            const r = await fetch("https://api.sleeper.app/v1/players/nfl");
            if (!r.ok) throw new Error("Sleeper answered " + r.status);
            const all = await r.json();
            const players = {};
            for (const id of Object.keys(all).sort()) {
              const p = all[id];
              if (!p || !p.injury_status) continue;
              if (!["QB", "RB", "WR", "TE"].includes(p.position)) continue;
              players[id] = [p.full_name || "", p.position, p.team || "FA", p.injury_status];
            }
            const n = Object.keys(players).length;
            // A near-empty list means Sleeper hiccuped. Keep the last good one.
            if (n < 20) throw new Error("only " + n + " players with a status - not publishing");
            let old = null;
            try { old = JSON.parse(fs.readFileSync("injuries.json", "utf8")); } catch (e) {}
            const today = new Date().toISOString().slice(0, 10);
            const same = old && JSON.stringify(old.players) === JSON.stringify(players);
            // Publish when something changed, and at least once a day either way
            // (GitHub pauses scheduled jobs in repos that go quiet for 60 days).
            if (same && old.updated && old.updated.slice(0, 10) === today) { console.log("no change"); return; }
            fs.writeFileSync("injuries.json", JSON.stringify({ updated: new Date().toISOString(), source: "Sleeper", count: n, players }));
            console.log(n + " players with a status");
          })().catch(e => { console.error(e); process.exit(1); });
          EOF
      - name: Publish if anything changed
        run: |
          git config user.name "roundtable-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add injuries.json
          if git diff --cached --quiet; then echo "nothing to publish"; exit 0; fi
          git commit -m "injuries $(date -u +%Y-%m-%dT%H:%MZ)"
          git push
